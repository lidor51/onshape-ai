<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">The nose may accommodate floor variation without</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">moving the indexer or changing the intended</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">receiver pose.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Four-bar motion changes the bridge gap and</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">contact force; nose float can lift away from</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">coral or hit the bumper.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Move a flat-stock four-bar through small</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">floor-height changes while hand-feeding</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">coral; inspect bridge gaps, dead spots and</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">hold pose.</text>
