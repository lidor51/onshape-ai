a46b11" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 4" marker-end="url(#arrow01)"/><circle cx="1230.4" cy="202.9" r="10" fill="white" stroke="#a46b11" stroke-width="2"/><text x="1245.4" y="192.9" font-size="15" fill="#a46b11" font-weight="600">pickup</text><rect x="1205" y="421.2" width="104" height="84" fill="#f0e6f3" stroke="#865196" stroke-width="2" stroke-dasharray="5 4" rx="4"/><g transform="translate(1257,463.2) rotate(0)"><rect x="-21.717" y="-57.30875" width="43.434" height="114.6175" fill="#f9e5ba" stroke="#df9e27" stroke-width="2" rx="7"/><line x1="0" y1="-49.30875" x2="0" y2="49.30875" stroke="#df9e27" stroke-width="1" stroke-dasharray="6 4"/></g><text x="1212" y="537.2" font-size="13" fill="#865196" font-weight="650">HANDOFF</text><line x1="765" y1="678" x2="830" y2="678" stroke="#202d2b" stroke-width="3" /><text x="758" y="696" font-size="13" fill="#202d2b" font-weight="400">100 mm</text><line x1="1450" y1="678" x2="1488" y2="678" stroke="#202d2b" stroke-width="3" /><text x="1448" y="696" font-size="13" fill="#202d2b" font-weight="400">100 mm</text><text x="54" y="727" font-size="19" fill="#202d2b" font-weight="600">Mouth intent 510 mm  |  Handoff y 260 / z 260 mm  |  Coral lengthwise</text>
<line x1="48" y1="748" x2="1545" y2="748" stroke="#d8dfdb" stroke-width="1" />
<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Separating pickup and orientation may keep the</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">moving nose small and the receiver pose</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">repeatable.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">A passive V can wedge a crosswise coral;</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">contact gaps between the pickup, kicker and</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">exit roll may cause dead spots.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Hand-feed slow, offset and crosswise coral</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">through a flat-stock mockup; check each</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">contact transition and receiver-absent hold.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: LOW  |  Contact, yaw, retention, stow and drives remain untested.</text>
<line x1="48" y1="973" x2="76" y2="973" stroke="#287b8a" stroke-width="4" /><text x="85" y="979" font-size="15" fill="#62726c" font-weight="400">guides / support</text><line x1="299" y1="973" x2="327" y2="973" stroke="#177855" stroke-width="4" /><text x="336" y="979" font-size="15" fill="#62726c" font-weight="400">powered contacts</text><line x1="550" y1="973" x2="578" y2="973" stroke="#337cbe" stroke-width="4" /><text x="587" y="979" font-size="15" fill="#62726c" font-weight="400">moving structure</text><line x1="801" y1="973" x2="829" y2="973" stroke="#a46b11" stroke-width="4" /><text x="838" y="979" font-size="15" fill="#62726c" font-weight="400">proposed coral path</text><line x1="1052" y1="973" x2="1080" y2="973" stroke="#865196" stroke-width="4" /><text x="1089" y="979" font-size="15" fill="#62726c" font-weight="400">receiver</text><line x1="1303" y1="973" x2="1331" y2="973" stroke="#a33830" stroke-width="4" /><text x="1340" y="979" font-size="15" fill="#62726c" font-weight="400">bumper / limit</text>
<text x="48" y="1010" font-size="15" fill="#62726c" font-weight="400">Actual-size nominal coral is shown at handoff. Dashed blue outlines are pose proposals, not checked sweeps. Same scales on every sheet.</text>
