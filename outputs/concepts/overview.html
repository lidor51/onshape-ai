<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Opposed moving surfaces may maintain contact</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">through the climb while a fixed cradle decouples</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">pickup from receiver timing.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Belt tracking, unequal speed and the floating</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">upper mount can skew or pinch coral; the</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">belt-to-cradle transition is unproven.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Mock up both opposed belt runs with</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">adjustable upper float; feed low-speed skewed</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">coral and inspect exit support and jam</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">reversal.</text>

<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">The nose may accommodate floor variation without</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">moving the indexer or changing the intended</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">receiver pose.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Four-bar motion changes the bridge gap and</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">contact force; nose float can lift away from</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">coral or hit the bumper.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Move a flat-stock four-bar through small</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">floor-height changes while hand-feeding</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">coral; inspect bridge gaps, dead spots and</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">hold pose.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: MODERATE  |  Contact, yaw, retention, stow and drives remain untested.</text>

<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">The same scoop captures and carries the piece; a</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">low inner pivot avoids a tall fixed receiver</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">tower.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Coral may fall from the rotating scoop.</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">Retention, dogleg arm clearance and the</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">receiver grip are unverified.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Rotate a cardboard scoop around the proposed</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">pivot with one pipe and a full bumper block;</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">test retention and direct receiver access.</text>

<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Translation preserves crosswise orientation and</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">reaches a rearward receiver without swinging the</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">entire intake through a large arc.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">The captive rise cam is the major complexity.</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">Follower binding, required drive force, drawer</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">sag and full stow are unverified.</text>

<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: HIGH  |  Contact, yaw, retention, stow and drives remain untested.</text>

<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Powered capture and discharge are separate from</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">the short tipping motion; the receiver stays</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">inboard at a distinct lengthwise offer pose.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Retention and discharge gating are unclear.</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">Coral may escape while tipping or double-feed;</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">nose-in entry is assumed, not 360-degree yaw</text><text x="557" y="890" font-size="19" fill="#202d2b" font-weight="400">acceptance.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Use a tilting plywood cradle and two rubber</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">rolls to capture one nose-in pipe; stop, tip</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">and discharge while checking escape and</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">release timing.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: MODERATE  |  Contact, yaw, retention, stow and drives remain untested.</text>

<text x="48" y="1010" font-size="15" fill="#62726c" font-weight="400">Actual-size nominal coral is shown at handoff. Dashed blue outlines are pose proposals, not checked sweeps. Same scales on every sheet.</text>

<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Leaves the front free and offers coral sideways</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">without turning it. Flat side plates and small</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">guide wheels suit the team's tools.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Side pickup changes the driving approach and</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">consumes side space. The lift, retention, and</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">swept clearance remain unresolved.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Mock up the full side bumper and one tube.</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">Test floor reach, lifting outside the band,</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">then sideways feed at 240 mm; reject any</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">bumper overlap.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: MODERATE  |  Contact, yaw, retention, stow and drives remain untested.</text>

<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Keeps hold of one tube through the transfer and</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">avoids a long intake deck. Router-cut links and</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">printed jaw pads are plausible starting points.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Capture width is small; arbitrary tube angles</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">may miss. Joint control and level jaws add</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">work, and the new receiver must accept coral</text><text x="557" y="890" font-size="19" fill="#202d2b" font-weight="400">at 387 mm.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Use two 220 mm mock links and simple jaws.</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">Try offset and angled tubes, then carry one</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">over a full bumper while checking grip and</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">wrist clearance.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: HIGH  |  Contact, yaw, retention, stow and drives remain untested.</text>

<text x="48" y="1010" font-size="15" fill="#62726c" font-weight="400">Actual-size nominal coral is shown at handoff. Dashed blue outlines are pose proposals, not checked sweeps. Same scales on every sheet.</text>
</g></g><text x="1030" y="2815" font-size="17" fill="#202d2b" font-weight="400">08 Small jaws grab a centered tube, lift it over the full bumper, and place it into a raised</text><text x="1030" y="2839" font-size="17" fill="#202d2b" font-weight="400">receiver. Two short links replace a continuous feed path.</text><g transform="translate(32,2857) scale(0.59875)">

<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Turns coral without swinging the whole intake. A</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">short plate deck and separate wheel banks keep</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">the turning job apart from the front pickup.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">The two banks may lose grip as coral turns.</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">Added drives and sensing need tests; the</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">receiver changes to a centered tray that</text><text x="557" y="890" font-size="19" fill="#202d2b" font-weight="400">accepts lengthwise coral.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">On a short two-bank deck, film one tube</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">turning from 70 to 35 to 0 degrees. Try slips</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">and offsets; then test the front lift over a</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">full bumper.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: MODERATE  |  Contact, yaw, retention, stow and drives remain untested.</text>
<line x1="48" y1="973" x2="76" y2="973" stroke="#287b8a" stroke-width="4" /><text x="85" y="979" font-size="15" fill="#62726c" font-weight="400">guides / support</text><line x1="299" y1="973" x2="327" y2="973" stroke="#177855" stroke-width="4" /><text x="336" y="979" font-size="15" fill="#62726c" font-weight="400">powered contacts</text><line x1="550" y1="973" x2="578" y2="973" stroke="#337cbe" stroke-width="4" /><text x="587" y="979" font-size="15" fill="#62726c" font-weight="400">moving structure</text><line x1="801" y1="973" x2="829" y2="973" stroke="#a46b11" stroke-width="4" /><text x="838" y="979" font-size="15" fill="#62726c" font-weight="400">proposed coral path</text><line x1="1052" y1="973" x2="1080" y2="973" stroke="#865196" stroke-width="4" /><text x="1089" y="979" font-size="15" fill="#62726c" font-weight="400">receiver</text><line x1="1303" y1="973" x2="1331" y2="973" stroke="#a33830" stroke-width="4" /><text x="1340" y="979" font-size="15" fill="#62726c" font-weight="400">bumper / limit</text>
<text x="48" y="1010" font-size="15" fill="#62726c" font-weight="400">Actual-size nominal coral is shown at handoff. Dashed blue outlines are pose proposals, not checked sweeps. Same scales on every sheet.</text>

<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Straight router-cut plates, linear slides,</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">turned drawbar and compliant pads need no</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">accurate bends. The 350 mm approach span is not</text><text x="48" y="890" font-size="19" fill="#202d2b" font-weight="400">the narrow bore-alignment window.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Dirty-bore grip and forced release are</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">unproved. Horizontal lift is assumed; pitch,</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">flex and stow need tests. The whole tube must</text><text x="557" y="890" font-size="19" fill="#202d2b" font-weight="400">clear the bumper before inward transfer.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Hardest: bench-test dirty, skewed bores under</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">cantilever load. Lift, latch outside,</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">cam-collapse pads and strip free; measure</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">slip, pitch and release force before</text><text x="1051" y="916" font-size="19" fill="#202d2b" font-weight="400">transfer.</text>
