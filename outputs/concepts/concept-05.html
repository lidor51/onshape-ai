<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Translation preserves crosswise orientation and</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">reaches a rearward receiver without swinging the</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">entire intake through a large arc.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">The captive rise cam is the major complexity.</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">Follower binding, required drive force, drawer</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">sag and full stow are unverified.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Slide a flat-stock drawer through a cardboard</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">cam track beside an intact bumper block;</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">check nose rise, binding and pipe retention.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: HIGH  |  Contact, yaw, retention, stow and drives remain untested.</text>
