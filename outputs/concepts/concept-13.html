<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Straight router-cut plates, linear slides,</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">turned drawbar and compliant pads need no</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">accurate bends. The 350 mm approach span is not</text><text x="48" y="890" font-size="19" fill="#202d2b" font-weight="400">the narrow bore-alignment window.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Dirty-bore grip and forced release are</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">unproved. Horizontal lift is assumed; pitch,</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">flex and stow need tests. The whole tube must</text><text x="557" y="890" font-size="19" fill="#202d2b" font-weight="400">clear the bumper before inward transfer.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Hardest: bench-test dirty, skewed bores under</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">cantilever load. Lift, latch outside,</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">cam-collapse pads and strip free; measure</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">slip, pitch and release force before</text><text x="1051" y="916" font-size="19" fill="#202d2b" font-weight="400">transfer.</text>
