<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">Opposed moving surfaces may maintain contact</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">through the climb while a fixed cradle decouples</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">pickup from receiver timing.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Belt tracking, unequal speed and the floating</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">upper mount can skew or pinch coral; the</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">belt-to-cradle transition is unproven.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Mock up both opposed belt runs with</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">adjustable upper float; feed low-speed skewed</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">coral and inspect exit support and jam</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">reversal.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: MODERATE  |  Contact, yaw, retention, stow and drives remain untested.</text>
