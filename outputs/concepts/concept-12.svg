<line x1="48" y1="748" x2="1545" y2="748" stroke="#d8dfdb" stroke-width="1" />
<text x="48" y="782" font-size="15" fill="#177855" font-weight="700">WHY CONSIDER IT</text><text x="48" y="812" font-size="19" fill="#202d2b" font-weight="400">A shallow feed avoids a lift arm; one motor, two</text><text x="48" y="838" font-size="19" fill="#202d2b" font-weight="400">belt drums and passive guides may simplify the</text><text x="48" y="864" font-size="19" fill="#202d2b" font-weight="400">95 mm handoff.</text>
<text x="557" y="782" font-size="15" fill="#a33830" font-weight="700">MAIN RISK</text><text x="557" y="812" font-size="19" fill="#202d2b" font-weight="400">Known R401/R402/R405 violation; Q152 rejects</text><text x="557" y="838" font-size="19" fill="#202d2b" font-weight="400">the notch exception. Traction, skew, floor</text><text x="557" y="864" font-size="19" fill="#202d2b" font-weight="400">pickup, retention and jaw transfer remain</text><text x="557" y="890" font-size="19" fill="#202d2b" font-weight="400">untested.</text>
<text x="1051" y="782" font-size="15" fill="#865196" font-weight="700">FIRST CHEAP TEST</text><text x="1051" y="812" font-size="19" fill="#202d2b" font-weight="400">Rules gate FIRST: reject for 2025 under</text><text x="1051" y="838" font-size="19" fill="#202d2b" font-weight="400">R401/R402/R405 and Q152. Paper-check support</text><text x="1051" y="864" font-size="19" fill="#202d2b" font-weight="400">and jaw access only; do not proceed to a</text><text x="1051" y="890" font-size="19" fill="#202d2b" font-weight="400">powered competition prototype.</text>
<text x="48" y="935" font-size="17" fill="#62726c" font-weight="400">Complexity estimate: LOW  |  Contact, yaw, retention, stow and drives remain untested.</text>
<line x1="48" y1="973" x2="76" y2="973" stroke="#287b8a" stroke-width="4" /><text x="85" y="979" font-size="15" fill="#62726c" font-weight="400">guides / support</text><line x1="299" y1="973" x2="327" y2="973" stroke="#177855" stroke-width="4" /><text x="336" y="979" font-size="15" fill="#62726c" font-weight="400">powered contacts</text><line x1="550" y1="973" x2="578" y2="973" stroke="#337cbe" stroke-width="4" /><text x="587" y="979" font-size="15" fill="#62726c" font-weight="400">moving structure</text><line x1="801" y1="973" x2="829" y2="973" stroke="#a46b11" stroke-width="4" /><text x="838" y="979" font-size="15" fill="#62726c" font-weight="400">proposed coral path</text><line x1="1052" y1="973" x2="1080" y2="973" stroke="#865196" stroke-width="4" /><text x="1089" y="979" font-size="15" fill="#62726c" font-weight="400">receiver</text><line x1="1303" y1="973" x2="1331" y2="973" stroke="#a33830" stroke-width="4" /><text x="1340" y="979" font-size="15" fill="#62726c" font-weight="400">bumper / limit</text>
<text x="48" y="1010" font-size="15" fill="#62726c" font-weight="400">Actual-size nominal coral is shown at handoff. Dashed blue outlines are pose proposals, not checked sweeps. Same scales on every sheet.</text>
