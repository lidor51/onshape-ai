<text x="35" y="1200" font-size="18" fill="#243631" font-weight="700" >STRATEGIC ROLE</text><text x="35" y="1237" font-size="21" fill="#243631" font-weight="400" >Aim a shared telescopic wrist with limited turret</text><text x="35" y="1265" font-size="21" fill="#243631" font-weight="400" >yaw for station/floor coral L1-L4 and</text><text x="35" y="1293" font-size="21" fill="#243631" font-weight="400" >floor/both-reef algae to processor or provisional</text><text x="35" y="1321" font-size="21" fill="#243631" font-weight="400" >net placement. Rotation may reduce chassis turns;</text><text x="35" y="1349" font-size="21" fill="#243631" font-weight="400" >no faster-cycle claim. Deliberately park only.</text><text x="570" y="1200" font-size="18" fill="#b97812" font-weight="700" >CORAL PATH</text><text x="570" y="1237" font-size="21" fill="#243631" font-weight="400" >Confirm empty coral-mode wrist; receive from</text><text x="570" y="1265" font-size="21" fill="#243631" font-weight="400" >station or capture loose floor coral. Center and</text><text x="570" y="1293" font-size="21" fill="#243631" font-weight="400" >retain, retract to a checked transit pose, approach</text><text x="570" y="1321" font-size="21" fill="#243631" font-weight="400" >reef and yaw/pitch/extend to chosen L1-L4. Confirm</text><text x="570" y="1349" font-size="21" fill="#243631" font-weight="400" >insertion/support and release before withdrawing.</text><text x="570" y="1377" font-size="21" fill="#243631" font-weight="400" >Reposition chassis at yaw blind spots. Initially</text><text x="570" y="1405" font-size="21" fill="#243631" font-weight="400" >stacked algae-on-coral needs a separate isolation</text><text x="570" y="1433" font-size="21" fill="#243631" font-weight="400" >sequence.</text><text x="1105" y="1200" font-size="18" fill="#238461" font-weight="700" >ALGAE PATH</text><text x="1105" y="1237" font-size="21" fill="#243631" font-weight="400" >Switch empty wrist, acquire isolated floor or</text><text x="1105" y="1265" font-size="21" fill="#243631" font-weight="400" >provisional low/high reef algae and retain one</text><text x="1105" y="1293" font-size="21" fill="#243631" font-weight="400" >ball. Include ball and jaws in every reach check.</text><text x="1105" y="1321" font-size="21" fill="#243631" font-weight="400" >Deliver to processor, or use net-placement intent</text><text x="1105" y="1349" font-size="21" fill="#243631" font-weight="400" >only after opening/contact clearance is</text><text x="1105" y="1377" font-size="21" fill="#243631" font-weight="400" >established; then verify release and withdraw.</text><text x="1105" y="1405" font-size="21" fill="#243631" font-weight="400" >Stacked-piece capture is untested; no simultaneous</text><text x="1105" y="1433" font-size="21" fill="#243631" font-weight="400" >coral retention.</text><text x="1640" y="1200" font-size="18" fill="#865b95" font-weight="700" >FIRST PROOF / MAIN TRADEOFF</text><text x="1640" y="1237" font-size="21" fill="#243631" font-weight="400" >Sweep the full wrist, cables and maximum-size held</text><text x="1640" y="1265" font-size="21" fill="#243631" font-weight="400" >algae through hard-stopped yaw, pitch and telescope</text><text x="1640" y="1293" font-size="21" fill="#243631" font-weight="400" >states. Test corner floor clearance, backlash and</text><text x="1640" y="1321" font-size="21" fill="#243631" font-weight="400" >blind spots; establish actual net opening geometry</text><text x="1640" y="1349" font-size="21" fill="#243631" font-weight="400" >before testing placement. High risk: cable</text><text x="1640" y="1377" font-size="21" fill="#243631" font-weight="400" >management, yaw backlash, boom deflection and range</text><text x="1640" y="1405" font-size="21" fill="#243631" font-weight="400" >blind spots. No simultaneous carry or climber.</text><text x="1640" y="1433" font-size="21" fill="#243631" font-weight="400" >Floor algae uses a near-limit corner envelope</text><text x="1640" y="1461" font-size="21" fill="#243631" font-weight="400" >beyond preferred margin; net placement is</text><text x="1640" y="1489" font-size="21" fill="#243631" font-weight="400" >unverified.</text>
