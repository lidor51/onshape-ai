<text x="35" y="1200" font-size="18" fill="#243631" font-weight="700" >STRATEGIC ROLE</text><text x="35" y="1237" font-size="21" fill="#243631" font-weight="400" >Capture floor coral in the moving carrier, center</text><text x="35" y="1265" font-size="21" fill="#243631" font-weight="400" >while raising and feed directly into the</text><text x="35" y="1293" font-size="21" fill="#243631" font-weight="400" >station-capable elevator tool for L1-L4. A separate</text><text x="35" y="1321" font-size="21" fill="#243631" font-weight="400" >short algae jaw serves floor/low reef to processor;</text><text x="35" y="1349" font-size="21" fill="#243631" font-weight="400" >reserve a shallow climb.</text><text x="570" y="1200" font-size="18" fill="#b97812" font-weight="700" >CORAL PATH</text><text x="570" y="1237" font-size="21" fill="#243631" font-weight="400" >Carrier captures isolated floor coral, locks lower</text><text x="570" y="1265" font-size="21" fill="#243631" font-weight="400" >contact, raises/centers, aligns directly to</text><text x="570" y="1293" font-size="21" fill="#243631" font-weight="400" >receiver and releases only after grip confirmation.</text><text x="570" y="1321" font-size="21" fill="#243631" font-weight="400" >Alternatively receive station coral in that same</text><text x="570" y="1349" font-size="21" fill="#243631" font-weight="400" >elevator wrist. Retract carrier, elevate/orient,</text><text x="570" y="1377" font-size="21" fill="#243631" font-weight="400" >place L1-L4, confirm empty and withdraw. Initially</text><text x="570" y="1405" font-size="21" fill="#243631" font-weight="400" >stacked pieces need algae isolation before coral</text><text x="570" y="1433" font-size="21" fill="#243631" font-weight="400" >pickup.</text><text x="1105" y="1200" font-size="18" fill="#238461" font-weight="700" >ALGAE PATH</text><text x="1105" y="1237" font-size="21" fill="#243631" font-weight="400" >Right jaw acquires one loose-floor or low-reef</text><text x="1105" y="1265" font-size="21" fill="#243631" font-weight="400" >algae, retains away from the coral carrier, then</text><text x="1105" y="1293" font-size="21" fill="#243631" font-weight="400" >approaches processor and confirms release. High</text><text x="1105" y="1321" font-size="21" fill="#243631" font-weight="400" >reef and net are excluded. Holding one coral</text><text x="1105" y="1349" font-size="21" fill="#243631" font-weight="400" >concurrently is optional pending paired-pose tests,</text><text x="1105" y="1377" font-size="21" fill="#243631" font-weight="400" >not permission for a second coral or algae.</text><text x="1105" y="1405" font-size="21" fill="#243631" font-weight="400" >Initially stacked pickup needs its own</text><text x="1105" y="1433" font-size="21" fill="#243631" font-weight="400" >control/clearance test.</text><text x="1640" y="1200" font-size="18" fill="#865b95" font-weight="700" >FIRST PROOF / MAIN TRADEOFF</text><text x="1640" y="1237" font-size="21" fill="#243631" font-weight="400" >Test skewed floor coral with the carrier's lower</text><text x="1640" y="1265" font-size="21" fill="#243631" font-weight="400" >contact locked; distinguish possession from</text><text x="1640" y="1293" font-size="21" fill="#243631" font-weight="400" >centering and prove receiver retention before</text><text x="1640" y="1321" font-size="21" fill="#243631" font-weight="400" >release. Check paired-piece envelopes, elevator</text><text x="1640" y="1349" font-size="21" fill="#243631" font-weight="400" >stow and shallow-hook engagement next. The carrier</text><text x="1640" y="1377" font-size="21" fill="#243631" font-weight="400" >owns capture, not a long V floor conveyor. Its</text><text x="1640" y="1405" font-size="21" fill="#243631" font-weight="400" >locked lower contact adds a sensitive direct</text><text x="1640" y="1433" font-size="21" fill="#243631" font-weight="400" >handoff. Independent one-coral/one-algae carry is a</text><text x="1640" y="1461" font-size="21" fill="#243631" font-weight="400" >hypothesis; omit high-reef algae, net and deep</text><text x="1640" y="1489" font-size="21" fill="#243631" font-weight="400" >climb to bound the short-arm design.</text>
<text x="35" y="1542" font-size="22" fill="#b16a65" font-weight="650" >STAGE 2 / PROPOSED GEOMETRY. No contact, stability, loaded climb, ballistics or rules-compliance pass.</text>
